name: GitHub-Profile-Summary-Cards
on:
  schedule:
    # runs Mon/Wed/Fri at midnight UTC
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.summary_gh_actions }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5.5
          AUTO_PUSH: false

      - name: Commit and push as Srish-ty
        run: |
          git config user.name "Srish-ty"
          git config user.email "68679980+Srish-ty@users.noreply.github.com"
          git add profile-summary-card-output/
          git diff --staged --quiet || git commit -m "fix: update profile summary cards"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.summary_gh_actions }}
